---
name: Bug Report
description: Report a bug in nimtest
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in nimtest! This helps us improve the framework for everyone.

  - type: input
    id: version
    attributes:
      label: nimtest Version
      description: What version of nimtest are you using?
      placeholder: "e.g., 0.2.0"
    validations:
      required: true

  - type: input
    id: nim-version
    attributes:
      label: Nim Version
      description: What version of Nim are you using?
      placeholder: "e.g., 1.6.0, 2.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Linux
        - macOS
        - Windows
        - Other (please specify)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: "Describe what happened and what you expected to happen."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a minimal code example that reproduces the issue.
      placeholder: |
        ```nim
        import nimtest
        import std/unittest

        suite "Bug Reproduction":
          var ctx: TestContext

          setup:
            ctx = createTestContext()

          teardown:
            ctx.cleanup()

          test "reproduces the bug":
            # Your code here
        ```
      render: nim
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here, such as error messages, stack traces, or related issues.
      placeholder: "Any additional information that might help us understand and fix the issue."

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please check all that apply.
      options:
        - label: I have searched for similar issues and couldn't find any
        - label: I have tested with the latest version of nimtest
        - label: I have included a minimal reproduction case
        - label: I have filled out all required fields