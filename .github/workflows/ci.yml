name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
      - run: nimble install nimtest
      - run: nim c -r tests/test_core.nim
      - run: nim c -r tests/test_helpers.nim
      - run: nim c -r tests/test_reporting.nim
      - run: nim c -r tests/test_progress.nim
      - uses: actions/upload-artifact@v3
        with:
          name: junit-report
          path: test-results.xml