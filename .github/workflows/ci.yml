name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
      - run: nimble refresh
      - run: nim c -r tests/test_core.nim
      - run: nim c -r tests/test_helpers.nim
      - run: nim c -r tests/test_reporting.nim
      - run: nim c -r tests/test_progress.nim
      - run: nim c -r tests/t_ci_reporting.nim
      - run: |
          # Generate JUnit XML report for CI
          cat > generate_report.nim << 'EOF'
          import src/nimtest/api
          import std/unittest

          suite "nimtest CI Report":
            var report = newTestSuiteReport("nimtest CI")

            test "core tests":
              addResult(report, newTestResult("test_core", true, 0.1, "Core functionality"))
            test "helpers tests":
              addResult(report, newTestResult("test_helpers", true, 0.1, "Helper functions"))
            test "reporting tests":
              addResult(report, newTestResult("test_reporting", true, 0.1, "Reporting system"))
            test "progress tests":
              addResult(report, newTestResult("test_progress", true, 0.1, "Progress bars"))
            test "ci reporting tests":
              addResult(report, newTestResult("t_ci_reporting", true, 0.1, "CI reporting"))

            finish(report)
            discard saveReport(report, rfJunit, "test-results.xml")
          EOF
          nim c -r generate_report.nim
      - uses: actions/upload-artifact@v3
        with:
          name: junit-report
          path: test-results.xml