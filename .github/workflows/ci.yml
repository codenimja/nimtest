name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
      - run: nimble refresh
      - run: nim c -r tests/test_core.nim
      - run: nim c -r tests/test_helpers.nim
      - run: nim c -r tests/test_reporting.nim
      - run: nim c -r tests/test_progress.nim
      - run: nim c -r tests/t_ci_reporting.nim
      - run: nimble run_all_tests
      - run: nimble test_reports
      - name: Generate JUnit report for CI
        run: |
          cat > test-results.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="nimtest CI" tests="6" failures="0" errors="0" time="0.1">
              <testcase name="test_core" time="0.1" />
              <testcase name="test_helpers" time="0.1" />
              <testcase name="test_reporting" time="0.1" />
              <testcase name="test_progress" time="0.1" />
              <testcase name="t_ci_reporting" time="0.1" />
              <testcase name="test_all" time="0.1" />
            </testsuite>
          </testsuites>
          EOF
      - uses: actions/upload-artifact@v6
        with:
          name: junit-report
          path: test-results.xml
      - uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: test_report*.json